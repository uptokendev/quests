[build]
  command = "npm run build"
  publish = "dist"

# Netlify serves the static quest frontend only.
# Runtime API requests are proxied to the MemeWarzone Railway API.
[[redirects]]
  from = "/api/*"
  to = "https://memewarzonefrontend-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
